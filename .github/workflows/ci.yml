
name: CI/CD DevSecOps

on:
  push:
    branches: [main]

env:
  DOCKER_IMAGE_NAME: alidr369/democyber:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # ---------- CHECKOUT ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- PARTIE I : GITLEAKS ----------
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      # ---------- PARTIE II : DOCKER ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      - name: Show image details
        run: docker images $DOCKER_IMAGE_NAME

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 15
          curl -fsS http://localhost:8080/ || (docker logs democyber-test; exit 1)
          docker stop democyber-test
          docker rm democyber-test

      # ---------- TRIVY : RAPPORT JSON ----------
      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

      # ---------- TRIVY : SECURITY GATE ----------
      - name: Trivy scan (security gate)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # ---------- PARTIE III : DOCKER HUB ----------
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME
