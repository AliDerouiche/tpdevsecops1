name: CI/CD DevSecOps

on:
  push:
    branches: [main]

env:
  # Doit être de la forme  utilisateur/nom:tag  pour pouvoir être poussée sur Docker Hub
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 -> récupère tout l'historique git (Gitleaks scanne les commits, pas seulement les fichiers)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- PARTIE I : Gitleaks ----------
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # if: always() -> sinon cette étape est ignorée quand Gitleaks échoue (et c'est là qu'on veut le rapport)
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      # ---------- PARTIE II : Docker + Trivy ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      - name: Show image details (nom, tag, taille)
        run: docker images $DOCKER_IMAGE_NAME

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 15
          # Pas de -f : une appli Spring sans contrôleur répond 404 sur "/", ce qui prouve qu'elle tourne
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080 || (docker logs democyber-test; exit 1)
          docker stop democyber-test
          docker rm democyber-test

      # 1) Rapport JSON (ne fait pas échouer le pipeline) -> sert d'artifact
      - name: Trivy scan (rapport JSON)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      # 2) Scan "gate" : affiche le tableau et fait échouer si CRITICAL/HIGH
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # ---------- PARTIE III : Push (seulement si tout ce qui précède a réussi) ----------
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME
