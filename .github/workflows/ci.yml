name: CI/CD DevSecOps

"on":
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: alidr369/democyber:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GITLEAKS
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      # JAVA AND MAVEN
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application with Maven
        run: mvn --batch-mode clean package

      # VERIFY DEPENDENCIES
      - name: Verify generated JAR
        shell: bash
        run: |
          echo "=== Spring Boot parent version ==="
          grep -A 4 '<artifactId>spring-boot-starter-parent</artifactId>' pom.xml

          echo "=== Spring Boot version in generated JAR ==="
          jar tf target/democyber-0.0.1-SNAPSHOT.jar | grep 'BOOT-INF/lib/spring-boot-'

          echo "=== Spring Framework, Tomcat and Jackson ==="
          jar tf target/democyber-0.0.1-SNAPSHOT.jar | grep -E 'BOOT-INF/lib/(spring-core|spring-webmvc|tomcat-embed-core|jackson-core)-'

      # DOCKER
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --no-cache -t "$DOCKER_IMAGE_NAME" .

      - name: Show image details
        run: docker images "$DOCKER_IMAGE_NAME"

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 "$DOCKER_IMAGE_NAME"
          sleep 15
          curl -fsS http://localhost:8080/ || (docker logs democyber-test; exit 1)
          docker stop democyber-test
          docker rm democyber-test

      # TRIVY JSON REPORT
      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

      # TRIVY SECURITY GATE
      - name: Trivy scan (security gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # PUSH ONLY IF ALL PREVIOUS STEPS PASS
      - name: Push Docker image
        run: docker push "$DOCKER_IMAGE_NAME"